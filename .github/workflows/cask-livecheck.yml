name: Cask livecheck and bump

on:
  schedule:
    # Run check every day around 03:00 GMT+1 (02:15 UTC; off-peak minute to reduce GitHub Actions queue delay)
    - cron: "15 1 * * *"
  workflow_dispatch: # Allows manual workflow dispatch from the GitHub UI

jobs:
  bump:
    runs-on: macos-latest
    # Permissions required to push commits directly to master
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Update Casks using Livecheck
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_PAT }}
        run: |
          # Fetch the latest version via livecheck. It outputs nothing if no new version exists.
          NEW_VERSION=$(brew developer on && brew livecheck trader-workstation@stable --newer-only --json | jq -r '.[0].version.latest // empty')

          if [ -n "$NEW_VERSION" ]; then
            echo "New version found: $NEW_VERSION"

            # Configure Git author
            git config --global user.name "Konstantinos Kostarellis"
            git config --global user.email "delight@users.noreply.github.com"

            # Update the cask file and commit locally without opening a PR
            brew bump-cask-pr --write-only --commit --no-audit --version="$NEW_VERSION" trader-workstation@stable

            # Push directly to master
            git push origin HEAD:master
          else
            echo "No new version found. Everything is up to date."
          fi
