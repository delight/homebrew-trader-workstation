name: Cask livecheck and bump

on:
  schedule:
    # Run check every day at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch: # Allows manual workflow dispatch from the GitHub UI

jobs:
  bump:
    runs-on: macos-latest
    # Permissions required for the bot to push commits and open pull requests
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Update Casks using Livecheck
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_PAT }}
        run: |
          # Fetch the latest version via livecheck. It outputs nothing if no new version exists.
          NEW_VERSION=$(brew livecheck trader-workstation@stable --newer-only --json | jq -r '.[0].version.latest // empty')

          if [ -n "$NEW_VERSION" ]; then
            echo "New version found: $NEW_VERSION"
            
            # Configure Git for the bot
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            # Create the pull request
            brew bump-cask-pr --no-browse --no-audit --version="$NEW_VERSION" trader-workstation@stable
          else
            echo "No new version found. Everything is up to date."
          fi
